<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Übersicht – phklein.net Entwürfe</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 1.5rem; background: #111; color: #ddd; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
    header { margin-bottom: 1.2rem; display: grid; gap: .8rem; }
    .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    a { color: #8ab4f8; }
    .lbl { color: #888; min-width: 8.5rem; }
    .pill, select { font: inherit; color: inherit; background: transparent; border: 1px solid #444; border-radius: 999px; padding: .28rem .7rem; text-decoration: none; cursor: pointer; }
    .pill:hover { background: #222; }
    .pill.on { background: #e6e6e6; color: #111; border-color: #e6e6e6; }
    select { background: #1c1c1c; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.2rem; }
    .card { display: block; color: inherit; text-decoration: none; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #181818; }
    .card:hover, .card:focus-visible { border-color: #8ab4f8; outline: none; }
    .shot { position: relative; height: 200px; overflow: hidden; }
    .shot iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
    .cap { display: flex; justify-content: space-between; gap: .6rem; padding: .5rem .7rem; }
    .cap span:last-child { color: #888; }
  </style>
</head>
<body>
  <header>
    <div class="row"><h1>Entwürfe für phklein.net</h1><a href="index.html">← zum Umschalter</a><span>Klick auf eine Karte öffnet die Kombination</span></div>
    <div class="row"><span class="lbl">Alle Paletten im Layout:</span><span id="layoutPills" class="row"></span></div>
    <div class="row"><span class="lbl">Eine Palette in allen Layouts:</span><select id="palSelect" aria-label="Palette wählen"></select></div>
  </header>
  <div class="grid" id="grid"></div>
  <script src="switcher.js"></script>
  <script>
    (function () {
      var P = window.PALETTES, L = window.LAYOUTS;
      var grid = document.getElementById("grid");
      var pills = document.getElementById("layoutPills");
      var sel = document.getElementById("palSelect");
      function pad(n) { return (n < 10 ? "0" : "") + n; }

      var opt = document.createElement("option");
      opt.value = ""; opt.textContent = "– Palette wählen –"; sel.appendChild(opt);
      P.forEach(function (p, i) { var o = document.createElement("option"); o.value = String(i + 1); o.textContent = pad(i + 1) + "  " + p.name; sel.appendChild(o); });
      sel.addEventListener("change", function () { if (sel.value) location.hash = "palette=" + sel.value; });

      L.forEach(function (l) {
        var a = document.createElement("a");
        a.className = "pill"; a.href = "#layout=" + l.id; a.textContent = l.name; a.setAttribute("data-id", l.id);
        pills.appendChild(a);
      });

      function card(pi, li, caption, side) {
        var a = document.createElement("a");
        a.className = "card";
        a.href = "index.html#" + (pi + 1) + "/" + L[li].id;
        a.innerHTML = '<div class="shot"><iframe loading="lazy" tabindex="-1" title="Vorschau ' + P[pi].name + ", " + L[li].name +
                      '" src="index.html?bare#' + (pi + 1) + "/" + L[li].id + '"></iframe></div>' +
                      '<div class="cap"><span>' + caption + "</span><span>" + side + "</span></div>";
        return a;
      }

      function render() {
        var m = location.hash.replace("#", "").match(/^(layout|palette)=(.+)$/);
        var mode = m ? m[1] : "layout", val = m ? m[2] : "terminal";
        grid.textContent = "";
        pills.querySelectorAll(".pill").forEach(function (p) { p.classList.toggle("on", mode === "layout" && p.getAttribute("data-id") === val); });
        sel.value = mode === "palette" ? val : "";
        if (mode === "palette") {
          var pi = Math.min(Math.max(parseInt(val, 10) - 1, 0), P.length - 1);
          L.forEach(function (l, li) { grid.appendChild(card(pi, li, l.name, pad(pi + 1) + " " + P[pi].name)); });
        } else {
          var lid = L.some(function (l) { return l.id === val; }) ? val : "terminal";
          var li2 = L.map(function (l) { return l.id; }).indexOf(lid);
          pills.querySelectorAll(".pill").forEach(function (p) { p.classList.toggle("on", p.getAttribute("data-id") === lid); });
          P.forEach(function (p, pi) { grid.appendChild(card(pi, li2, pad(pi + 1) + " " + p.name, L[li2].name)); });
        }
        scale();
      }

      function scale() {
        document.querySelectorAll(".shot").forEach(function (s) {
          var f = s.firstChild, k = s.clientWidth / 1280;
          f.style.transform = "scale(" + k + ")";
          s.style.height = Math.round(800 * k) + "px";
        });
      }
      window.addEventListener("resize", scale);
      window.addEventListener("hashchange", render);
      render();
    })();
  </script>
</body>
</html>
